<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0a0f" />
    <title>Pixel City — Offline</title>
    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        min-height: 100%;
        margin: 0;
      }

      body {
        display: grid;
        place-items: center;
        padding: max(28px, env(safe-area-inset-top)) max(22px, env(safe-area-inset-right))
          max(28px, env(safe-area-inset-bottom)) max(22px, env(safe-area-inset-left));
        color: #f4f4f8;
        background:
          radial-gradient(circle at 20% 18%, rgba(255, 204, 51, 0.18), transparent 28%),
          radial-gradient(circle at 82% 76%, rgba(226, 64, 64, 0.16), transparent 32%),
          linear-gradient(135deg, #06070d 0%, #0a0a0f 50%, #111827 100%);
        font-family: "Courier New", Courier, monospace;
      }

      main {
        width: min(620px, 100%);
        border: 4px solid #2e3446;
        border-radius: 18px;
        padding: clamp(24px, 5vw, 44px);
        background: rgba(10, 10, 15, 0.88);
        box-shadow:
          0 28px 80px rgba(0, 0, 0, 0.42),
          inset 0 0 0 2px rgba(255, 204, 51, 0.08);
        text-align: center;
      }

      img {
        width: 96px;
        height: 96px;
        image-rendering: pixelated;
        border-radius: 22px;
        box-shadow: 0 18px 40px rgba(0, 0, 0, 0.35);
      }

      h1 {
        margin: 22px 0 10px;
        color: #ffcc33;
        font-size: clamp(30px, 8vw, 56px);
        line-height: 1;
        letter-spacing: -0.06em;
        text-transform: uppercase;
      }

      p {
        margin: 0 auto;
        max-width: 48ch;
        color: #c7cad6;
        font-size: clamp(15px, 3vw, 18px);
        line-height: 1.65;
      }

      .status {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        margin-top: 24px;
        padding: 10px 14px;
        border: 2px solid rgba(255, 204, 51, 0.28);
        border-radius: 999px;
        color: #ffdf74;
        background: rgba(255, 204, 51, 0.08);
        font-size: 13px;
        text-transform: uppercase;
      }

      .dot {
        width: 10px;
        height: 10px;
        background: #e24040;
        border-radius: 999px;
        box-shadow: 0 0 18px rgba(226, 64, 64, 0.9);
      }
    </style>
  </head>
  <body>
    <main>
      <img src="assets/icons/icon-192.png" alt="" width="96" height="96" />
      <h1>Offline</h1>
      <p>
        Pixel City is installed, but this route is not cached yet. Reconnect once, open
        the game, and the city shell will stay ready for future offline sessions.
      </p>
      <div class="status" aria-live="polite"><span class="dot" aria-hidden="true"></span>Connection required</div>
    </main>
  </body>
</html>
