<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="description" content="Pixel City — a 2D open-world pixel crime game inspired by classic GTA 1 & 2." />
    <meta name="theme-color" content="#0a0a0f" />
    <meta name="color-scheme" content="dark" />
    <meta name="application-name" content="Pixel City" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Pixel City" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="msapplication-TileColor" content="#0a0a0f" />
    <meta name="msapplication-config" content="browserconfig.xml" />
    <meta property="og:title" content="Pixel City — Open World" />
    <meta property="og:description" content="Install Pixel City as a fullscreen, offline-capable open-world game." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="assets/screenshots/pixel-city-wide.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Pixel City — Open World" />
    <meta name="twitter:description" content="A fullscreen, offline-capable 2D open-world pixel crime game." />
    <meta name="twitter:image" content="assets/screenshots/pixel-city-wide.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="assets/icons/favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="assets/icons/apple-touch-icon.png" />
    <title>Pixel City — Open World</title>
    <style>
      /* The game canvas fills the viewport on a black backdrop.
         Pixel-art rendering is preserved by disabling image smoothing. */
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0a0a0f;
        font-family: 'Courier New', Courier, monospace;
        overscroll-behavior: none;
        color-scheme: dark;
        -webkit-tap-highlight-color: transparent;
      }
      #game {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #game canvas {
        image-rendering: pixelated;
        image-rendering: crisp-edges;
      }
      .mobile-game,
      .mobile-game body,
      .mobile-game #game,
      .mobile-game #game canvas {
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
      }
      .safe-area-probe {
        position: fixed;
        inset: 0;
        visibility: hidden;
        pointer-events: none;
        padding: env(safe-area-inset-top) env(safe-area-inset-right)
          env(safe-area-inset-bottom) env(safe-area-inset-left);
      }
      .orientation-overlay {
        position: fixed;
        inset: 0;
        z-index: 10000;
        display: none;
        place-content: center;
        justify-items: center;
        gap: 12px;
        padding: max(24px, env(safe-area-inset-top)) max(24px, env(safe-area-inset-right))
          max(24px, env(safe-area-inset-bottom)) max(24px, env(safe-area-inset-left));
        color: #f4f4f8;
        background: #0a0a0f;
        text-align: center;
        font-family: 'Courier New', Courier, monospace;
        letter-spacing: 0;
      }
      .orientation-overlay.visible {
        display: grid;
      }
      .orientation-overlay strong {
        color: #ffcc33;
        font-size: clamp(20px, 6vw, 34px);
      }
      .orientation-overlay p {
        color: #b7b7c2;
        font-size: 15px;
      }
      .orientation-phone {
        width: 48px;
        height: 76px;
        border: 4px solid #f4f4f8;
        border-radius: 8px;
        transform: rotate(90deg);
        animation: orientation-pulse 1.6s ease-in-out infinite;
      }
      .orientation-phone span {
        display: block;
        width: 14px;
        height: 3px;
        margin: 5px auto 0;
        background: #ffcc33;
      }
      @keyframes orientation-pulse {
        0%, 100% { transform: rotate(0deg); opacity: 0.65; }
        45%, 65% { transform: rotate(90deg); opacity: 1; }
      }
      @media (prefers-reduced-motion: reduce) {
        .orientation-phone { animation: none; transform: rotate(90deg); }
      }
    </style>
  </head>
  <body>
    <!-- Phaser mounts its canvas into this container (see GameConfig.parent). -->
    <div id="game"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
